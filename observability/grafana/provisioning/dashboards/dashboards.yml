# Dashboards are JSON files in observability/grafana/dashboards/. Subfolders become Grafana folders.
apiVersion: 1

providers:
  - name: repo
    orgId: 1
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
