apiVersion: 1

datasources:
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s

  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    editable: false
    jsonData:
      derivedFields:
        # JSON log lines are stored as fields; link the trace_id field to the VictoriaTraces datasource
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: victoriatraces
          url: '$${__value.raw}'

  - name: VictoriaTraces
    uid: victoriatraces
    type: jaeger
    access: proxy
    url: http://victoriatraces:10428/select/jaeger
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: victorialogs
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        # $$ escapes Grafana's provisioning env-var expansion
        query: 'trace_id:="$${__trace.traceId}"'
