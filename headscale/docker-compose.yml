# Headscale: self-hosted Tailscale coordination server.
#
# Tailscale clients (phones, the tailscale/ stack) log in here instead of
# Tailscale's cloud. Exposed through Traefik with a Let's Encrypt cert.
# Settings in config.yaml are overridden by HEADSCALE_* env vars below.
services:
  headscale:
    image: headscale/headscale:0.29
    container_name: headscale
    restart: unless-stopped
    command: serve
    environment:
      HEADSCALE_SERVER_URL: https://${HEADSCALE_HOSTNAME}
      HEADSCALE_DNS_BASE_DOMAIN: ${HEADSCALE_BASE_DOMAIN}
    volumes:
      - ./config.yaml:/etc/headscale/config.yaml:ro
      - headscale_data:/var/lib/headscale
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.headscale.rule=Host(`${HEADSCALE_HOSTNAME}`)"
      - "traefik.http.routers.headscale.entrypoints=websecure"
      - "traefik.http.routers.headscale.tls.certresolver=letsencrypt"
      - "traefik.http.services.headscale.loadbalancer.server.port=8080"

volumes:
  headscale_data:
    name: headscale_data

networks:
  proxy:
    external: true
