# Headscale configuration.
# server_url and dns.base_domain are placeholders - they are set from the
# HEADSCALE_SERVER_URL / HEADSCALE_DNS_BASE_DOMAIN env vars in docker-compose.yml.
# Any key can be overridden the same way: HEADSCALE_<KEY> with "." -> "_".
# Reference: https://github.com/juanfont/headscale/blob/main/config-example.yaml

server_url: https://headscale.example.com
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090

# TLS is terminated by Traefik.
tls_cert_path: ""
tls_key_path: ""

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# Use Tailscale's public relay (DERP) servers.
derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 3h

disable_check_updates: false

node:
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

log:
  level: info
  format: text

policy:
  mode: file
  path: ""

dns:
  magic_dns: true
  # Must differ from the server_url domain, e.g. ts.example.com.
  base_domain: ts.example.com
  override_local_dns: true
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1
  search_domains: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"
