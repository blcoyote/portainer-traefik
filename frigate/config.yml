# Frigate 0.18 config, migrated from the 0.13 sample.config.yml.
# Seed copy: copy to /home/parsec/frigate_config/config.yml and replace 192.168.0.x with real IPs.
# Pi 5 has no H.264 hardware decoder, so no hwaccel_args: detect decodes the 640x360 sub-streams on CPU.
mqtt:
  enabled: true
  host: 192.168.0.x # MQTT broker IP
  port: 1883
  topic_prefix: frigate
  client_id: frigate
  user: csce_app
  password: '{FRIGATE_MQTT_PASSWORD}'

detectors:
  coral:
    type: edgetpu
    device: usb

objects:
  track:
    - person
  filters:
    person:
      min_score: 0.75

snapshots:
  enabled: true
  bounding_box: true
  quality: 90
  retain:
    default: 7
    objects:
      person: 30

# 0.13 kept event recordings 7 days for person (the only tracked object) and nothing continuous.
record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 0
  alerts:
    retain:
      days: 7
      mode: active_objects
  detections:
    retain:
      days: 7
      mode: active_objects

birdseye:
  enabled: true
  mode: continuous

# One connection per stream to each camera; Frigate and Home Assistant read from the restream.
go2rtc:
  streams:
    gavl_vest:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.0.x:8554/Streaming/Channels/101
    gavl_vest_sub:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.0.x:8554/Streaming/Channels/102
    garage:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.0.x:8554/Streaming/Channels/101
    garage_sub:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.0.x:8554/Streaming/Channels/102
    have:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.0.x:8554/Streaming/Channels/101
    have_sub:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.0.x:8554/Streaming/Channels/102
    gavl_oest:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.0.x:8554/Streaming/Channels/101
    gavl_oest_sub:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.0.x:8554/Streaming/Channels/102
    vaerksted:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.0.x:8554/Streaming/Channels/101
    vaerksted_sub:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.0.x:8554/Streaming/Channels/102
    stuen:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.0.x:8554/Streaming/Channels/101
    stuen_sub:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.0.x:8554/Streaming/Channels/102
    koekken:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.0.x:8554/Streaming/Channels/101
    koekken_sub:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.0.x:8554/Streaming/Channels/102

# Masks converted from 640x360 pixels to relative coordinates (0.14+ format).
cameras:
  gavl_vest:
    ui:
      order: 1
      dashboard: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/gavl_vest
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/gavl_vest_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    motion:
      mask:
        mask1:
